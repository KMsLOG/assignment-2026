openapi: 3.0.3
info:
  title: 대학교 수강신청 API
  version: 1.0.0
  description: |
    수강신청 시스템 백엔드 API 명세입니다.
    본 문서는 평가자가 문서만으로 테스트를 작성할 수 있도록 요청/응답/에러를 명시합니다.
servers:
  - url: http://localhost:8000
    description: 로컬 개발 서버
tags:
  - name: health
    description: 서버 상태 확인
  - name: students
    description: 학생 조회 및 시간표 조회
  - name: professors
    description: 교수 조회
  - name: courses
    description: 강좌 조회
  - name: enrollments
    description: 수강신청 및 수강취소
paths:
  /health:
    get:
      tags: [health]
      summary: 헬스체크
      description: 서버 기동 상태와 초기 데이터 생성 상태를 반환합니다.
      responses:
        "200":
          description: 정상 응답
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                success:
                  value:
                    status: ok
                    seed:
                      completed: true
                      seeded: true
                      duration_ms: 734
                      counts:
                        departments: 12
                        professors: 120
                        courses: 600
                        students: 10000

  /api/students:
    get:
      tags: [students]
      summary: 학생 목록 조회
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
          description: 조회 개수
        - in: query
          name: offset
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: 조회 시작 위치
      responses:
        "200":
          description: 정상 응답
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudentResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"

  /api/students/{student_id}/timetable:
    get:
      tags: [students]
      summary: 내 시간표(이번 학기) 조회
      parameters:
        - in: path
          name: student_id
          required: true
          schema:
            type: integer
            minimum: 1
          description: 학생 ID
      responses:
        "200":
          description: 정상 응답
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CourseResponse"
        "404":
          description: 학생 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                student_not_found:
                  value:
                    code: STUDENT_NOT_FOUND
                    message: Student not found.
                    details:
                      student_id: 999999

  /api/professors:
    get:
      tags: [professors]
      summary: 교수 목록 조회
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - in: query
          name: offset
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: 정상 응답
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProfessorResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"

  /api/courses:
    get:
      tags: [courses]
      summary: 강좌 목록 조회 (전체/학과별)
      parameters:
        - in: query
          name: department_id
          required: false
          schema:
            type: integer
            minimum: 1
          description: 학과 ID(없으면 전체 조회)
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - in: query
          name: offset
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: 정상 응답
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CourseResponse"
              examples:
                sample:
                  value:
                    - id: 1
                      name: 자료구조 01분반
                      credits: 3
                      capacity: 30
                      enrolled: 25
                      schedule: 월 09:00-10:30
                      department_id: 1
                      professor_id: 1
        "400":
          $ref: "#/components/responses/InvalidRequest"

  /api/enrollments:
    post:
      tags: [enrollments]
      summary: 수강신청
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollmentRequest"
            examples:
              sample:
                value:
                  student_id: 1
                  course_id: 10
      responses:
        "200":
          description: 신청 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          description: 학생/강좌 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                student_not_found:
                  value:
                    code: STUDENT_NOT_FOUND
                    message: Student not found.
                    details:
                      student_id: 999999
                course_not_found:
                  value:
                    code: COURSE_NOT_FOUND
                    message: Course not found.
                    details:
                      course_id: 999999
        "409":
          description: 비즈니스 규칙 위반
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                already_enrolled:
                  value:
                    code: ALREADY_ENROLLED
                    message: Student already enrolled in this course.
                    details:
                      student_id: 1
                      course_id: 10
                course_full:
                  value:
                    code: COURSE_FULL
                    message: Course capacity is full.
                    details:
                      course_id: 10
                      capacity: 30
                credit_limit_exceeded:
                  value:
                    code: CREDIT_LIMIT_EXCEEDED
                    message: Credit limit exceeded.
                    details:
                      student_id: 1
                      current_credits: 18
                      new_course_credits: 3
                      max_credits: 18
                schedule_conflict:
                  value:
                    code: SCHEDULE_CONFLICT
                    message: Schedule conflict detected.
                    details:
                      student_id: 1
                      course_id: 12
                      conflict_course_id: 8

  /api/enrollments/{student_id}/{course_id}:
    delete:
      tags: [enrollments]
      summary: 수강취소
      parameters:
        - in: path
          name: student_id
          required: true
          schema:
            type: integer
            minimum: 1
        - in: path
          name: course_id
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: 취소 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelEnrollmentResponse"
        "404":
          description: 학생/강좌/수강내역 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                enrollment_not_found:
                  value:
                    code: ENROLLMENT_NOT_FOUND
                    message: Enrollment not found.
                    details:
                      student_id: 1
                      course_id: 10

components:
  responses:
    InvalidRequest:
      description: 요청 검증 실패
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            invalid_request:
              value:
                code: INVALID_REQUEST
                message: Request validation failed.
                details:
                  errors: []

  schemas:
    HealthResponse:
      type: object
      required: [status, seed]
      properties:
        status:
          type: string
          example: ok
        seed:
          type: object
          additionalProperties: true
          description: 초기 데이터 생성 상태 정보

    ErrorResponse:
      type: object
      required: [code, message, details]
      properties:
        code:
          type: string
          example: COURSE_FULL
        message:
          type: string
          example: Course capacity is full.
        details:
          type: object
          additionalProperties: true

    StudentResponse:
      type: object
      required: [id, student_no, name, department_id, grade]
      properties:
        id:
          type: integer
          example: 1
        student_no:
          type: string
          example: "2026000001"
        name:
          type: string
          example: 김민준
        department_id:
          type: integer
          example: 1
        grade:
          type: integer
          example: 2

    ProfessorResponse:
      type: object
      required: [id, professor_no, name, email, department_id]
      properties:
        id:
          type: integer
          example: 1
        professor_no:
          type: string
          example: PF000001
        name:
          type: string
          example: 박서연
        email:
          type: string
          format: email
          example: prof0001@univ.ac.kr
        department_id:
          type: integer
          example: 1

    CourseResponse:
      type: object
      required:
        [id, name, credits, capacity, enrolled, schedule, department_id, professor_id]
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: 자료구조 01분반
        credits:
          type: integer
          example: 3
        capacity:
          type: integer
          example: 30
        enrolled:
          type: integer
          example: 25
        schedule:
          type: string
          example: 월 09:00-10:30
        department_id:
          type: integer
          example: 1
        professor_id:
          type: integer
          example: 1

    EnrollmentRequest:
      type: object
      required: [student_id, course_id]
      properties:
        student_id:
          type: integer
          minimum: 1
          example: 1
        course_id:
          type: integer
          minimum: 1
          example: 10

    EnrollmentResponse:
      type: object
      required: [student_id, course_id, enrolled_at]
      properties:
        student_id:
          type: integer
          example: 1
        course_id:
          type: integer
          example: 10
        enrolled_at:
          type: string
          format: date-time
          example: "2026-02-08T06:20:00.000000Z"

    CancelEnrollmentResponse:
      type: object
      required: [student_id, course_id, canceled]
      properties:
        student_id:
          type: integer
          example: 1
        course_id:
          type: integer
          example: 10
        canceled:
          type: boolean
          example: true
