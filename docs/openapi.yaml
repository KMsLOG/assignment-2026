openapi: 3.0.3
info:
  title: 대학 수강신청 API
  version: 1.1.0
  description: |
    수강신청 백엔드 API 명세입니다.
    목록 조회는 커서 기반 페이지네이션(limit + cursor)을 사용합니다.
servers:
  - url: http://localhost:8000
    description: 로컬 개발 서버

tags:
  - name: health
    description: 서버 상태 확인
  - name: students
    description: 학생 조회 및 시간표 조회
  - name: professors
    description: 교수 조회
  - name: courses
    description: 강좌 조회
  - name: enrollments
    description: 수강신청 및 수강취소

paths:
  /health:
    get:
      tags: [health]
      summary: 헬스체크
      description: 서버 상태와 초기 데이터 생성 상태를 반환합니다.
      responses:
        '200':
          description: 정상 응답
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                success:
                  value:
                    status: ok
                    seed:
                      completed: true
                      seeded: true
                      duration_ms: 734
                      counts:
                        departments: 12
                        professors: 120
                        courses: 600
                        students: 10000

  /api/students:
    get:
      tags: [students]
      summary: 학생 목록 조회
      description: 학생 목록을 ID 오름차순으로 커서 기반 조회합니다.
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
      responses:
        '200':
          description: 정상 응답
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentListResponse'
              examples:
                first_page:
                  value:
                    items:
                      - id: 1
                        student_no: '2026000001'
                        name: 김민준
                        department_id: 1
                        grade: 2
                    next_cursor: 1
                last_page:
                  value:
                    items:
                      - id: 10000
                        student_no: '2026010000'
                        name: 최지우
                        department_id: 7
                        grade: 4
                    next_cursor: null
        '400':
          $ref: '#/components/responses/InvalidRequest'

  /api/students/{student_id}/timetable:
    get:
      tags: [students]
      summary: 내 시간표(이번 학기) 조회
      parameters:
        - in: path
          name: student_id
          required: true
          schema:
            type: integer
            minimum: 1
          description: 학생 ID
      responses:
        '200':
          description: 정상 응답
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CourseResponse'
              examples:
                sample:
                  value:
                    - id: 101
                      name: 자료구조 01분반
                      credits: 3
                      capacity: 40
                      enrolled: 38
                      schedule: 월 09:00-10:15
                      department_id: 1
                      professor_id: 12
        '404':
          description: 학생 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                student_not_found:
                  $ref: '#/components/examples/StudentNotFound'

  /api/professors:
    get:
      tags: [professors]
      summary: 교수 목록 조회
      description: 교수 목록을 ID 오름차순으로 커서 기반 조회합니다.
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
      responses:
        '200':
          description: 정상 응답
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfessorListResponse'
              examples:
                first_page:
                  value:
                    items:
                      - id: 1
                        professor_no: PF000001
                        name: 박서준
                        email: prof0001@univ.ac.kr
                        department_id: 1
                    next_cursor: 1
        '400':
          $ref: '#/components/responses/InvalidRequest'

  /api/courses:
    get:
      tags: [courses]
      summary: 강좌 목록 조회 (전체/학과별)
      description: |
        강좌 목록을 ID 오름차순으로 커서 기반 조회합니다.
        `department_id`가 있으면 해당 학과 강좌만 조회합니다.
      parameters:
        - in: query
          name: department_id
          required: false
          schema:
            type: integer
            minimum: 1
          description: 학과 ID
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
      responses:
        '200':
          description: 정상 응답
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseListResponse'
              examples:
                first_page:
                  value:
                    items:
                      - id: 1
                        name: 자료구조 01분반
                        credits: 3
                        capacity: 40
                        enrolled: 38
                        schedule: 월 09:00-10:15
                        department_id: 1
                        professor_id: 3
                    next_cursor: 1
                filtered:
                  value:
                    items:
                      - id: 15
                        name: 운영체제 01분반
                        credits: 3
                        capacity: 35
                        enrolled: 27
                        schedule: 화 13:00-14:15
                        department_id: 1
                        professor_id: 9
                    next_cursor: 15
        '400':
          $ref: '#/components/responses/InvalidRequest'

  /api/enrollments:
    post:
      tags: [enrollments]
      summary: 수강신청
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollmentRequest'
            examples:
              sample:
                value:
                  student_id: 1
                  course_id: 10
      responses:
        '200':
          description: 신청 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentResponse'
              examples:
                success:
                  value:
                    student_id: 1
                    course_id: 10
                    enrolled_at: '2026-02-08T06:20:00.000000'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          description: 학생/강좌 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                student_not_found:
                  $ref: '#/components/examples/StudentNotFound'
                course_not_found:
                  $ref: '#/components/examples/CourseNotFound'
        '409':
          description: 비즈니스 규칙 위반
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                already_enrolled:
                  $ref: '#/components/examples/AlreadyEnrolled'
                course_full:
                  $ref: '#/components/examples/CourseFull'
                credit_limit_exceeded:
                  $ref: '#/components/examples/CreditLimitExceeded'
                schedule_conflict:
                  $ref: '#/components/examples/ScheduleConflict'
                concurrency_retry_exhausted:
                  $ref: '#/components/examples/ConcurrencyRetryExhausted'
        '503':
          description: 일시적 과부하 또는 DB 풀 고갈
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                enrollment_request_limit_reached:
                  $ref: '#/components/examples/EnrollmentRequestLimitReached'
                db_connection_pool_exhausted:
                  $ref: '#/components/examples/DbConnectionPoolExhausted'

  /api/enrollments/{student_id}/{course_id}:
    delete:
      tags: [enrollments]
      summary: 수강취소
      parameters:
        - in: path
          name: student_id
          required: true
          schema:
            type: integer
            minimum: 1
          description: 학생 ID
        - in: path
          name: course_id
          required: true
          schema:
            type: integer
            minimum: 1
          description: 강좌 ID
      responses:
        '200':
          description: 취소 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelEnrollmentResponse'
              examples:
                success:
                  value:
                    student_id: 1
                    course_id: 10
                    canceled: true
        '404':
          description: 학생/강좌/수강내역 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                student_not_found:
                  $ref: '#/components/examples/StudentNotFound'
                course_not_found:
                  $ref: '#/components/examples/CourseNotFound'
                enrollment_not_found:
                  $ref: '#/components/examples/EnrollmentNotFound'

components:
  parameters:
    LimitParam:
      in: query
      name: limit
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
      description: 한 번에 조회할 최대 개수
    CursorParam:
      in: query
      name: cursor
      required: false
      schema:
        type: integer
        minimum: 1
      description: 이전 페이지의 next_cursor 값

  responses:
    InvalidRequest:
      description: 요청 검증 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalid_request:
              $ref: '#/components/examples/InvalidRequest'

  examples:
    InvalidRequest:
      value:
        code: INVALID_REQUEST
        message: Request validation failed.
        details:
          errors: []
    StudentNotFound:
      value:
        code: STUDENT_NOT_FOUND
        message: Student not found.
        details:
          student_id: 999999
    CourseNotFound:
      value:
        code: COURSE_NOT_FOUND
        message: Course not found.
        details:
          course_id: 999999
    EnrollmentNotFound:
      value:
        code: ENROLLMENT_NOT_FOUND
        message: Enrollment not found.
        details:
          student_id: 1
          course_id: 10
    AlreadyEnrolled:
      value:
        code: ALREADY_ENROLLED
        message: Student already enrolled in this course.
        details:
          student_id: 1
          course_id: 10
    CourseFull:
      value:
        code: COURSE_FULL
        message: Course capacity is full.
        details:
          course_id: 10
          capacity: 30
    CreditLimitExceeded:
      value:
        code: CREDIT_LIMIT_EXCEEDED
        message: Credit limit exceeded.
        details:
          student_id: 1
          current_credits: 18
          new_course_credits: 3
          max_credits: 18
    ScheduleConflict:
      value:
        code: SCHEDULE_CONFLICT
        message: Schedule conflict detected.
        details:
          student_id: 1
          course_id: 12
          conflict_course_id: 8
    ConcurrencyRetryExhausted:
      value:
        code: CONCURRENCY_RETRY_EXHAUSTED
        message: Concurrent update conflict. Please retry.
        details:
          student_id: 1
          course_id: 10
          operation: enroll
          attempts: 3
          db_error_code: 1213
    EnrollmentRequestLimitReached:
      value:
        code: ENROLLMENT_REQUEST_LIMIT_REACHED
        message: Enrollment API is busy. Please retry shortly.
        details:
          max_inflight_requests: 40
    DbConnectionPoolExhausted:
      value:
        code: DB_CONNECTION_POOL_EXHAUSTED
        message: Database connection pool is busy. Please retry shortly.
        details:
          request_id: 7f84a9cc-7c02-4689-9d2f-6ce7c2cc4b9c

  schemas:
    HealthResponse:
      type: object
      required: [status, seed]
      properties:
        status:
          type: string
          example: ok
        seed:
          type: object
          additionalProperties: true
          description: 초기 데이터 생성 상태 정보

    ErrorResponse:
      type: object
      required: [code, message, details]
      properties:
        code:
          type: string
          example: COURSE_FULL
        message:
          type: string
          example: Course capacity is full.
        details:
          type: object
          additionalProperties: true

    StudentResponse:
      type: object
      required: [id, student_no, name, department_id, grade]
      properties:
        id:
          type: integer
          example: 1
        student_no:
          type: string
          example: '2026000001'
        name:
          type: string
          example: 김민준
        department_id:
          type: integer
          example: 1
        grade:
          type: integer
          example: 2

    StudentListResponse:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StudentResponse'
        next_cursor:
          type: integer
          nullable: true
          description: 다음 페이지 조회용 커서 (마지막 페이지면 null)
          example: 100

    ProfessorResponse:
      type: object
      required: [id, professor_no, name, email, department_id]
      properties:
        id:
          type: integer
          example: 1
        professor_no:
          type: string
          example: PF000001
        name:
          type: string
          example: 박서준
        email:
          type: string
          format: email
          example: prof0001@univ.ac.kr
        department_id:
          type: integer
          example: 1

    ProfessorListResponse:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProfessorResponse'
        next_cursor:
          type: integer
          nullable: true
          description: 다음 페이지 조회용 커서 (마지막 페이지면 null)
          example: 100

    CourseResponse:
      type: object
      required: [id, name, credits, capacity, enrolled, schedule, department_id, professor_id]
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: 자료구조 01분반
        credits:
          type: integer
          example: 3
        capacity:
          type: integer
          example: 40
        enrolled:
          type: integer
          example: 38
        schedule:
          type: string
          example: 월 09:00-10:15
        department_id:
          type: integer
          example: 1
        professor_id:
          type: integer
          example: 3

    CourseListResponse:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CourseResponse'
        next_cursor:
          type: integer
          nullable: true
          description: 다음 페이지 조회용 커서 (마지막 페이지면 null)
          example: 100

    EnrollmentRequest:
      type: object
      required: [student_id, course_id]
      properties:
        student_id:
          type: integer
          minimum: 1
          example: 1
        course_id:
          type: integer
          minimum: 1
          example: 10

    EnrollmentResponse:
      type: object
      required: [student_id, course_id, enrolled_at]
      properties:
        student_id:
          type: integer
          example: 1
        course_id:
          type: integer
          example: 10
        enrolled_at:
          type: string
          format: date-time
          example: '2026-02-08T06:20:00.000000'

    CancelEnrollmentResponse:
      type: object
      required: [student_id, course_id, canceled]
      properties:
        student_id:
          type: integer
          example: 1
        course_id:
          type: integer
          example: 10
        canceled:
          type: boolean
          example: true
